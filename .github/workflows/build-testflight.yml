name: Build and upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip swift test'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TEAM_ID: F8X8H9J6AY
      KEYCHAIN_PATH: ${{ github.workspace }}/build/signing.keychain-db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Prepare pinned converter and dictionaries
        run: bash scripts/bootstrap.sh
      - name: Generate Xcode project
        run: |
          # project.yml selects SwiftPM traits (Zenzai/ZenzaiCPU) for the
          # Converter package. Writing package traits into the generated
          # project requires XcodeGen >= 2.46.0, so upgrade/install instead
          # of trusting a possibly older preinstalled copy, which would
          # silently drop the trait selection.
          brew upgrade xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate
          # Fail loudly if the trait selection did not reach the project:
          # without Zenzai/ZenzaiCPU the converter links llama.cpp mock
          # stubs and the keyboard shows no conversion candidates.
          grep -q 'Zenzai' NumberKey.xcodeproj/project.pbxproj
          grep -q 'ZenzaiCPU' NumberKey.xcodeproj/project.pbxproj
      - name: Cache SwiftPM test build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-test-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-test-
      - name: Test kana input and dictionary conversion
        if: ${{ !inputs.skip_tests }}
        run: swift test --configuration release
      - name: Resolve iOS dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NumberKey.xcodeproj -scheme NumberKey \
            -clonedSourcePackagesDirPath build/SourcePackages
      - name: Bundle third-party notices
        run: python3 scripts/collect_licenses.py
      - name: Install signing assets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_KEYBOARD_BASE64: ${{ secrets.PROFILE_KEYBOARD_BASE64 }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p build/signing ~/private_keys \
            ~/Library/MobileDevice/"Provisioning Profiles"
          # App Store Connect API key where altool looks for it
          printf %s "$ASC_PRIVATE_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # Distribution certificate (.p12) into a temporary keychain
          printf %s "$DIST_CERT_P12_BASE64" | base64 --decode > build/signing/dist.p12
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import build/signing/dist.p12 -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          # Provisioning profiles
          printf %s "$PROFILE_APP_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/"Provisioning Profiles"/OneKeyboardAppStore.mobileprovision
          printf %s "$PROFILE_KEYBOARD_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/"Provisioning Profiles"/OneKeyboardKeyboardAppStore.mobileprovision
      - name: Archive (manual signing)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project NumberKey.xcodeproj -scheme NumberKey \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NumberKey.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=F8X8H9J6AY \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            | tee build/archive.log
      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/NumberKey.xcarchive \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath build/export \
            | tee build/export.log
          ls -la build/export
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(ls build/export/*.ipa | head -n1)"
          echo "Uploading $IPA_PATH"
          xcrun altool --upload-app --type ios -f "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee build/upload.log
      - name: Retain exported IPA
        uses: actions/upload-artifact@v4
        with:
          name: one-keyboard-ipa-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics
          path: |
            build/archive.log
            build/export.log
            build/upload.log
          if-no-files-found: ignore
          retention-days: 7
