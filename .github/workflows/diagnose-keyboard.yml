name: Diagnose keyboard startup
on:
  workflow_dispatch:
  push:
    paths:
      - 'Diagnostics/**'
      - 'Keyboard/**'
      - 'App/**'
      - 'project.yml'
      - '.github/workflows/diagnose-keyboard.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show iOS toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Prepare converter
        run: bash scripts/bootstrap.sh
      - name: Generate simulator test project
        run: |
          # Same requirement as the TestFlight workflow: XcodeGen >= 2.46.0
          # writes the SwiftPM trait selection (Zenzai/ZenzaiCPU) into the
          # generated project. An older preinstalled copy silently drops it
          # and the converter links llama.cpp mock stubs instead of the real
          # inference engine, so the tests would exercise a crippled build.
          brew upgrade xcodegen || brew install xcodegen
          xcodegen --version
          python3 Diagnostics/configure_project.py
          xcodegen generate
          grep -q 'Zenzai' NumberKey.xcodeproj/project.pbxproj
          grep -q 'ZenzaiCPU' NumberKey.xcodeproj/project.pbxproj
      - name: Select iPhone simulator
        run: |
          python3 - <<'PY'
          import re, subprocess, os, sys
          # Pick from the destinations xcodebuild itself offers for this scheme:
          # simctl can list devices (older runtimes) that xcodebuild then refuses
          # with "Unable to find a device matching the provided destination".
          out = subprocess.run(['xcodebuild','-showdestinations','-project','NumberKey.xcodeproj','-scheme','KeyboardStartup'],
                               capture_output=True, text=True).stdout
          entries = []
          for line in out.splitlines():
              m = re.search(r'platform:iOS Simulator.*id:([0-9A-Fa-f-]{36}).*OS:([0-9.]+).*name:([^,}]+)', line)
              if m and 'iPhone' in m.group(3):
                  ver = tuple(int(x) for x in m.group(2).split('.'))
                  entries.append((ver, m.group(3).strip(), m.group(1)))
          if not entries:
              print('No iPhone destination offered by xcodebuild', file=sys.stderr)
              print(out)
              sys.exit(1)
          entries.sort(reverse=True)
          ver, name, udid = entries[0]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIMULATOR_ID='+udid+'\n')
          print({'name': name, 'os': '.'.join(map(str, ver)), 'udid': udid})
          PY
      - name: Test keyboard view lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test -project NumberKey.xcodeproj -scheme KeyboardStartup \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/Simulator \
            -resultBundlePath build/KeyboardStartup.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build/keyboard-startup.log
      - name: Export layout previews
        if: always()
        run: xcrun xcresulttool export attachments --path build/KeyboardStartup.xcresult --output-path build/layout-previews || true
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-startup-diagnostics
          path: |
            build/keyboard-startup.log
            build/layout-previews
            build/KeyboardStartup.xcresult
          if-no-files-found: ignore
          retention-days: 7
