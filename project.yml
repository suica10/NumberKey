name: NumberKey
options:
  bundleIdPrefix: jp.suica10
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.2'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Converter:
    path: Vendor/AzooKeyKanaKanjiConverter
targets:
  NumberKey:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.suica10.NumberKey
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: NumberKey
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: NumberKeyKeyboard
        embed: true
  NumberKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.suica10.NumberKey.Keyboard
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: NumberKey 日本語
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: false
    dependencies:
      - package: Converter
        product: KanaKanjiConverterModuleWithDefaultDictionary
schemes:
  NumberKey:
    build:
      targets:
        NumberKey: all
