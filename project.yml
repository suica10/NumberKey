name: NumberKey
options:
  bundleIdPrefix: jp.onejpkey
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.34'
    CURRENT_PROJECT_VERSION: '44'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 27 enables Swift explicit modules by default. Its dependency
    # scanner tries to build a PCM for marisa-trie (the C++ target of
    # SwiftyMarisa, which joins the graph via the Zenzai traits) without
    # C++ language mode and fails with "'cstdio' file not found". Xcode 16
    # compiled it as a plain C++ target. Keep explicit modules off so the
    # C++ package targets build the classic way.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
packages:
  Converter:
    path: Vendor/AzooKeyKanaKanjiConverter
    # The converter links its llama.cpp binary target only when the Zenzai /
    # ZenzaiCPU traits are enabled (SwiftPM traits, tools 6.1). Xcode 16
    # ignored traits so the real llama was always linked; Xcode 27 honors
    # them, so without this selection the module falls back to llama mock
    # stubs and conversion returns no candidates on device. Enabling both
    # traits reproduces the Xcode 16 behavior. Requires XcodeGen >= 2.46.0
    # (see build-testflight.yml, which enforces the version).
    traits:
      - Zenzai
      - ZenzaiCPU
targets:
  NumberKey:
    type: application
    platform: iOS
    sources:
      - App
      - path: Keyboard/KeyboardSettings.swift
      - path: Keyboard/PurchaseState.swift
      - path: Keyboard/DictionaryPacks.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.onejpkey.NumberKey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: One Keyboard App Store
        CODE_SIGN_ENTITLEMENTS: App/NumberKey.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: One Keyboard
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: jp.onejpkey.NumberKey
            CFBundleURLSchemes:
              - onekeyboard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: NumberKeyKeyboard
        embed: true
  NumberKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.onejpkey.NumberKey.Keyboard
        PROVISIONING_PROFILE_SPECIFIER: One Keyboard Keyboard App Store
        CODE_SIGN_ENTITLEMENTS: Keyboard/NumberKeyKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # The keyboard imports the converter module, whose dependency chain
        # ends in SwiftyMarisa's C++-only marisa_trie module. Without C++
        # interoperability, this target's Swift frontend tries to build
        # marisa_trie as an Objective-C module and fails on its C++
        # headers ('namespace' / <cstdio> errors) under Xcode 27. The
        # converter's own targets already compile with Cxx interop via
        # their package traits; the consuming target needs it too.
        SWIFT_OBJC_INTEROP_MODE: objcxx
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: One Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    dependencies:
      - package: Converter
        product: KanaKanjiConverterModuleWithDefaultDictionary
schemes:
  NumberKey:
    build:
      targets:
        NumberKey: all
